[project]
name = "code-atlas"
version = "0.1.0"
description = "Indexes a codebase into verified, agent-readable docs — then answers questions about it from the terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0.43",
    "pydantic>=2.7",
    "pydantic-settings[toml]>=2.4",
    "tomli-w>=1.0",
    "pathspec>=0.12",
    "jinja2>=3.1",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
bedrock = ["langchain-aws>=0.2"]

[project.scripts]
code-atlas = "code_atlas.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_atlas"]
