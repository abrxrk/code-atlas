[project]
name = "code-atlas"
version = "0.1.0"
description = "Indexes a codebase into verified, agent-readable docs — then answers questions about it from the terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0.43",
    "pydantic>=2.7",
    "pydantic-settings[toml]>=2.4",
    "tomli-w>=1.0",
]

[project.scripts]
code-atlas = "code_atlas.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
